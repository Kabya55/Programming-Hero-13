<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>This my header no banner</h1>
      <h1>Welcome to my DOM</h1>
    </header>
    <body>
      <p>This is a paragraph.</p>
      <p>This is another paragraph.</p>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
    </body>
    <script>
      const h1Collections = document.getElementsByTagName("h1");
      for (const collection of h1Collections) {
        console.log(collection.innerText);
      }
      const pcollection = document.getElementsByTagName("p");
      console.log(pcollection);
      for (const p of pcollection) {
        console.log(p.innerText);
      }
      const ulCollection = document.getElementsByTagName("ul");
      console.log(ulCollection);
      const liCollection = document.getElementsByTagName("li");
      console.log(liCollection);
      for (const li of liCollection) {
        console.log(li.innerText);
      }
    </script>
  </body>
</html>
