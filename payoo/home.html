<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="home">Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- tailwind and daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
    <!-- icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-300">
    <header
      class="w-11/12 sticky top-0 z-20 bg-base-300 border-b-2 border-black-300 flex justify-between items-center py-3 mx-auto"
    >
      <div class="left flex">
        <div class="w-[60px]">
          <img src="./assets/logo.png" alt="" />
        </div>
        <div class="blance-information">
          <h1 class="ml-2 text-2xl font-bold">
            $<span id="blance">45000</span>
          </h1>
          <p class="text-[#080808]/50">Available Balance</p>
        </div>
      </div>
      <div>
        <a href="./index.html" class="btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a
        >
      </div>
    </header>

    <section class="welcome-section m-6">
      <h1 class="text-[#080808] text-2xl font-bold">
        Welcome to Pay<span class="text-[#7460FF]">oo</span>
      </h1>
      <p class="text-[#080808]/50">
        Enjoy easy and convenient financial services with us. <br />
        Cashout charge is low and
      </p>
    </section>

    <!-- Card section -->
    <section class="card w-11/12 grid grid-cols-3 mx-auto gap-3">
      <button
        onclick="hideAndShow('add-money')"
        class="btn flex-col h-full py-4 btn-primary btn-soft"
      >
        <img src="./assets/opt-1.png" alt="Add Money" />
        <p>Add Money</p>
      </button>

      <button
        onclick="hideAndShow('cash-out')"
        class="btn flex-col h-full py-4 btn-primary btn-soft"
      >
        <img src="./assets/opt-2.png" alt="Cashout" />
        <p>Cashout</p>
      </button>

      <button
        onclick="hideAndShow('transfer-money')"
        class="btn flex-col h-full py-4 btn-primary btn-soft"
      >
        <img src="./assets/opt-3.png" alt="Transfer Money" />
        <p>Transfer Money</p>
      </button>

      <button
        onclick="hideAndShow(`get-bonus`)"
        class="btn flex-col h-full py-4 btn-primary btn-soft"
      >
        <img src="./assets/opt-4.png" alt="Get Bonus" />
        <p>Get Bonus</p>
      </button>

      <button
        onclick="hideAndShow('pay-bill')"
        class="btn flex-col h-full py-4 btn-primary btn-soft"
      >
        <img src="./assets/opt-5.png" alt="Pay Bill" />
        <p>Pay Bill</p>
      </button>

      <button
        onclick="hideAndShow(`history`)"
        class="btn flex-col h-full py-4 btn-primary btn-soft"
      >
        <img src="./assets/opt-6.png" alt="Transactions" />
        <p>Transactions</p>
      </button>
    </section>

    <!-- add Mony -->
    <section id="add-money" class="w-11/12 mx-auto py-6 hidden">
      <h2 class="text-[#080808] text-2xl font-bold">Add Money</h2>
      <div class="login-form mt-5">
        <div
          class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl"
        >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Select A Bank</label
              >

              <select id="bank-name" class="select bg-base-200 rounded-full">
                <option disabled selected>Select A Bank</option>
                <option value="IBBL">IBBL</option>
                <option value="DBBL">DBBL</option>
                <option value="TFIC">IFIC</option>
              </select>
            </fieldset>
            <!-- <br /> -->

            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Bank Account Number</label
              >
              <input
                id="add-mony-input-number"
                type="text"
                maxlength="11"
                minlength="11"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 11 digit account number"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Amount to Add</label
              >
              <input
                id="add-mony-input-blance"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Add Amount to withdraw"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Pin Number</label
              >
              <input
                id="add-mony-pass"
                type="password"
                maxlength="4"
                minlength="4"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 4 Digit Pin"
              />
              <button
                id="add-money-btn"
                class="btn bg-[#3B25C1] mt-4 rounded-full text-white"
              >
                Add Money
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>

    <!-- Cash Out Section -->
    <section id="cash-out" class="w-11/12 mx-auto py-6 hidden">
      <h2 class="text-[#080808] text-2xl font-bold">Cash Out</h2>
      <div class="login-form mt-5">
        <div
          class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl"
        >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Agent Number</label
              >
              <input
                id="input-number"
                type="text"
                maxlength="11"
                minlength="11"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 11 digit number"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Amount</label
              >
              <input
                id="input-blance"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Enter amount to withdraw"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Pin Number</label
              >
              <input
                id="input-pass"
                type="password"
                maxlength="4"
                minlength="4"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 4 Digit Pin"
              />
              <button
                id="withdraw-money"
                class="btn bg-[#3B25C1] mt-4 rounded-full text-white"
              >
                Withdraw Money
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>

    <!-- Transfer Money Section -->
    <section id="transfer-money" class="w-11/12 mx-auto py-6 hidden">
      <h2 class="text-[#080808] text-2xl font-bold">Transfer Money</h2>
      <div class="login-form mt-5">
        <div
          class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl"
        >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >User Account Number</label
              >
              <input
                id="transfer-money-input-number"
                type="text"
                maxlength="11"
                minlength="11"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 11 digit number"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Amount</label
              >
              <input
                id="transfer-money-input-blance"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Enter amount to transfer"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Pin Number</label
              >
              <input
                id="transfer-money-input-pass"
                type="password"
                maxlength="4"
                minlength="4"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 4 Digit Pin"
              />
              <button
                id="transfer-money-btn"
                class="btn bg-[#3B25C1] mt-4 rounded-full text-white"
              >
                Send Now
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>

    <!-- Get Bonus Section -->
    <section id="get-bonus" class="w-11/12 mx-auto py-6 hidden">
      <h2 class="text-[#080808] text-2xl font-bold">Get Bonus</h2>
      <div class="login-form mt-5">
        <div
          class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl"
        >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Enter Bonus Coupon</label
              >
              <input
                id="bonus-coupon"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Enter your coupon"
              />

              <button
                id="bonus-btn"
                class="btn bg-[#3B25C1] mt-4 rounded-full text-white"
              >
                Get Bonus
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>

    <!-- Pay Bill -->
    <section id="pay-bill" class="w-11/12 mx-auto py-6 hidden">
      <h2 class="text-[#080808] text-2xl font-bold">Pay Bill</h2>
      <div class="login-form mt-5">
        <div
          class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl"
        >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Select To Pay</label
              >

              <select id="pay-name" class="select bg-base-200 rounded-full">
                <option disabled selected>Select back</option>
                <option value="Internet">Internet</option>
                <option value="pani">Water</option>
                <option value="Current">Current</option>
              </select>
            </fieldset>
            <!-- <br /> -->

            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Biller Account Number</label
              >
              <input
                id="pay-input-number"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Enter account number"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Amount to Pay</label
              >
              <input
                id="pay-bill-input-blance"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Add Amount to pay"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Pin Number</label
              >
              <input
                id="pay-bill-pass"
                type="password"
                maxlength="4"
                minlength="4"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 4 Digit Pin"
              />
              <button
                id="pay-bill-btn"
                class="btn bg-[#3B25C1] mt-4 rounded-full text-white"
              >
                Pay Now
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>

    <!-- history -->
    <section id="history" class="w-11/12 mx-auto py-6 hidden">
      <h2 class="text-[#080808] text-2xl font-bold">Transaction History</h2>
      <div id="history-containner">
        <!-- <div class="p-2 bg-base-100 mt-1"></div> -->
      </div>
    </section>

    <!-- JS -->
    <script src="./js/masin.js"></script>
    <script src="./js/addMoney.js"></script>
    <script src="./js/cashout.js"></script>
    <script src="./js/transferMoney.js"></script>
    <script src="./js/bonus.js"></script>
    <script src="./js/payBill.js"></script>
  </body>
</html>
