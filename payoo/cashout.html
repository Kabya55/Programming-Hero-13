<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <!-- tailwind and daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
    <!-- icon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen max-w-md mx-auto bg-base-300">
    <header
      class="w-11/12 border-b-2 border-black-300 flex justify-between items-center py-3 mx-auto"
    >
      <div class="left flex">
        <div class="w-[60px]">
          <img src="./assets/logo.png" alt="" />
        </div>
        <div class="blance-information">
          <h1 class="ml-2 text-2xl font-bold">
            <span id="blance">$45000</span>
          </h1>
          <p class="text-[#080808]/50">Available Balance</p>
        </div>
      </div>
      <div>
        <a href="./index.html" class="btn">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Log Out</a
        >
      </div>
    </header>

    <section class="welcome-section m-6">
      <h1 class="text-[#080808] text-2xl font-bold">
        Welcome to Pay<span class="text-[#7460FF]">oo</span>
      </h1>
      <p class="text-[#080808]/50">
        Enjoy easy and convenient financial services with us. <br />
        Cashout charge is low and
      </p>
    </section>

    <!-- Card section -->
    <section class="card w-11/12 grid grid-cols-3 mx-auto gap-3">
      <button class="btn flex-col h-full py-4 btn-primary btn-soft">
        <img src="./assets/opt-1.png" alt="Add Money" />
        <p>Add Money</p>
      </button>

      <button class="btn flex-col h-full py-4 btn-primary btn-soft">
        <img src="./assets/opt-2.png" alt="Cashout" />
        <p>Cashout</p>
      </button>

      <button class="btn flex-col h-full py-4 btn-primary btn-soft">
        <img src="./assets/opt-3.png" alt="Transfer Money" />
        <p>Transfer Money</p>
      </button>

      <button class="btn flex-col h-full py-4 btn-primary btn-soft">
        <img src="./assets/opt-4.png" alt="Get Bonus" />
        <p>Get Bonus</p>
      </button>

      <button class="btn flex-col h-full py-4 btn-primary btn-soft">
        <img src="./assets/opt-5.png" alt="Pay Bill" />
        <p>Pay Bill</p>
      </button>

      <button class="btn flex-col h-full py-4 btn-primary btn-soft">
        <img src="./assets/opt-6.png" alt="Transactions" />
        <p>Transactions</p>
      </button>
    </section>

    <!-- Cash Out Section -->
    <section id="cash-out" class="w-11/12 mx-auto py-6">
      <h2 class="text-[#080808] text-2xl font-bold">Cash Out</h2>
      <div class="login-form mt-5">
        <div
          class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl mx-auto rounded-2xl"
        >
          <div class="card-body">
            <fieldset class="fieldset">
              <label class="label text-neutral font-bold text-[16px]"
                >Agent Number</label
              >
              <input
                id="input-number"
                type="text"
                maxlength="11"
                minlength="11"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 11 digit number"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Amount</label
              >
              <input
                id="input-number"
                type="text"
                class="input bg-base-200 rounded-full"
                placeholder="Enter amount to withdraw"
              />
              <br />
              <label class="label text-neutral font-bold text-[16px]"
                >Pin Number</label
              >
              <input
                id="input-pass"
                type="password"
                maxlength="4"
                minlength="4"
                class="input bg-base-200 rounded-full"
                placeholder="Enter 4 Digit Pin"
              />
              <button
                id="withdraw-money"
                class="btn bg-[#3B25C1] mt-4 rounded-full text-white"
              >
                Withdraw Money
              </button>
            </fieldset>
          </div>
        </div>
      </div>
    </section>
    <script src="./js/cashout.js"></script>
  </body>
</html>
