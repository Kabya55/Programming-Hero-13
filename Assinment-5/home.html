<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />
    <!-- tailwind and daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC]">
    <!-- Navbar start -->
    <header class="sticky top-0 z-10">
      <div class="navbar bg-base-100 shadow-sm">
        <div class="flex flex-1 gap-4">
          <img
            src="./assets/github-logo.png"
            alt="github-logo"
            class="w-[36px]"
          />
          <h1 class="font-semibold text-2xl">GitHub Issues Tracker</h1>
        </div>
        <div class="flex gap-2">
          <input
            type="text"
            placeholder="🔍 Search"
            class="input input-bordered w-24 md:w-auto"
          />
          <button class="btn btn-primary">Search</button>
        </div>
      </div>
    </header>
    <!-- Navbar end -->

    <!-- all open closed btn section start -->

    <section
      class="w-11/12 mx-auto flex gap-4 mt-[60px] bg-base-100 shadow-sm p-4"
    >
      <button
        onclick="(loadAllIssues(), setActive(this))"
        class="btn btn-primary"
      >
        All
      </button>
      <button onclick="(loadOpenIssues(), setActive(this))" class="btn">
        Open
      </button>
      <button onclick="(loadClosedIssues(), setActive(this))" class="btn">
        Closed
      </button>
    </section>
    <!-- all open closed btn section end -->

    <!--issues count section start  -->

    <section
      class="w-11/12 mx-auto flex gap-4 mt-[60px] bg-base-100 shadow-sm p-4"
    >
      <div class="w-full flex items-center justify-between">
        <!-- Left Side -->
        <div class="flex items-center gap-4">
          <!-- Icon -->
          <div
            class="w-10 h-10 flex items-center justify-center rounded-full bg-purple-100"
          >
            <img src="./assets/Aperture.png" alt="Aperture" />
          </div>

          <!-- Text -->
          <div>
            <h2 id="issu-count" class="text-lg font-semibold text-gray-800">
              50 Issues
            </h2>
            <p class="text-sm text-gray-500">
              Track and manage your project issues
            </p>
          </div>
        </div>

        <!-- Right Side -->
        <div class="flex items-center gap-6 text-sm">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-green-500 rounded-full"></span>
            <span class="text-gray-700">Open</span>
          </div>

          <div class="flex items-center gap-2">
            <span class="w-3 h-3 bg-purple-500 rounded-full"></span>
            <span class="text-gray-700">Closed</span>
          </div>
        </div>
      </div>
    </section>
    <!-- issues count section end -->

    <!-- issues section start  -->
    <section
      id="all-issues-container"
      class="w-11/12 mx-auto grid grid-cols-3 gap-4 mt-[60px] bg-base-100 shadow-sm p-4"
    >
