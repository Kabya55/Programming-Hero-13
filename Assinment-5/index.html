<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker</title>
    <link
      rel="shortcut icon"
      href="./assets/github-logo.png"
      type="image/x-icon"
    />
    <!-- tailwind and daisyui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Geist", sans-serif;
      }
    </style>
  </head>
  <body>
    <section class="min-h-screen w-11/12 max-w-md mx-auto flex items-center">
      <fieldset
        class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4"
      >
        <div class="logo text-center mb-5 mt-5">
          <img class="mx-auto" src="./assets/github-logo.png" alt="" />
          <h1 class="font-semibold text-2xl mt-3">GitHub Issues Tracker</h1>
          <p class="text-base">Sign in to manage your issues</p>
        </div>

        <label class="label font-medium text-base">Username</label>
        <input type="email" class="input" placeholder="Enter Username" />
        <label class="label font-medium text-base text-[#4A00FF]"
          >Default: admin</label
        >

        <label class="label font-medium text-base mt-4">Password</label>
        <input type="password" class="input" placeholder="Enter Password" />
        <label class="label font-medium text-base text-[#4A00FF]"
          >Default: admin123</label
        >

        <button class="btn btn-primary mt-5 mb-5">Sign In</button>
      </fieldset>
    </section>
  </body>
</html>
