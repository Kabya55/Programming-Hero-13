<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API</title>
    <style>
      #post-containner {
        max-width: 1160px;
        margin: 50px auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-gap: 20px;
        row-gap: 40px;
      }
      .post-card {
        height: 100%;
        text-align: center;
        /* background-color: rgba(48, 48, 48, 0.403); */
        border-radius: 20px;
        border: 1px solid gray;
        box-shadow: 1px 1px 1px 1px rgb(165, 195, 197);
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Hi KABYA</h1>
    <button onclick="loadData()">Click</button>
    <button onclick="loadPost()">Load post</button>
    <button onclick="loadPhoto()">Load photo</button>
    <br /><br />
    <h1>All posts</h1>
    <div id="post-containner"></div>
    <h1>Photo</h1>
    <div id="photo-containner"></div>

    <script src="./api.js"></script>
    <script src="./post.js"></script>
    <script src="./photo.js"></script>
  </body>
</html>
